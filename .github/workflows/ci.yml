name: CI

on:
  push:
  pull_request:

# The workflow only reads the code; it never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps do not use git, so do not leave the token in the git config.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # No OPENAI_API_KEY here: the tests never hit the network, and config is only read per request.
      - run: npm test
      - run: npm run build
